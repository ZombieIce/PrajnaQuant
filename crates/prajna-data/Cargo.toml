[package]
name = "prajna-data"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.1"
description = "Arrow and Parquet data contracts for Prajna Quant"
license = "MIT"
publish = false

[dependencies]
arrow-cast = "=58.4.0"
arrow-array = "=58.4.0"
arrow-schema = "=58.4.0"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tempfile = "3.14"
fs2 = "=0.4.3"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "0.10"
csv = "1.4"
parquet = { version = "=58.4.0", default-features = false, features = ["arrow", "zstd"] }
prajna-domain = { path = "../prajna-domain" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
sha2 = "0.10"
zip = { version = "6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.14"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
