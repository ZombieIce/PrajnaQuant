[package]
name = "prajna-experiment"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.1"
description = "Experiment definitions and identities for Prajna Quant"
license = "MIT"
publish = false

[dependencies]
fs2 = "0.4"
arrow-array = "=58.4.0"
arrow-schema = "=58.4.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
parquet = { version = "=58.4.0", default-features = false, features = ["arrow", "zstd"] }
prajna-domain = { path = "../prajna-domain" }
prajna-data = { path = "../prajna-data" }
prajna-research = { path = "../prajna-research" }
polars = { version = "=0.55.2", default-features = false, features = ["dtype-date", "dtype-datetime"] }
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.14"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
