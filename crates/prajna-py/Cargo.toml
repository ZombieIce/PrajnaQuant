[package]
name = "prajna-py"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.1"
description = "Python-hosted bindings for the Prajna research platform"
license = "MIT"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
arrow-array = { version = "=58.4.0", features = ["ffi"] }
arrow-schema = "=58.4.0"
arrow-select = "=58.4.0"
chrono = { version = "0.4", default-features = false, features = ["std"] }
polars = { version = "=0.55.2", default-features = false, features = ["dtype-date", "dtype-datetime"] }
prajna-data = { path = "../prajna-data" }
prajna-domain = { path = "../prajna-domain" }
prajna-research = { path = "../prajna-research" }
prajna-experiment = { path = "../prajna-experiment" }
pyo3 = { version = "=0.29.0", features = ["abi3-py312"] }
rayon = "1.11"
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
polars-io = { version = "=0.55.2", default-features = false, features = ["parquet"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
