<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Prajna Quant · 策略绩效</title>
  <style>
    :root{color-scheme:light;--nav:#111827;--nav2:#1f2937;--bg:#f4f6fa;--panel:#fff;--text:#172033;--muted:#697386;--border:#e2e7ef;--grid:#e9edf3;--blue:#2563eb;--cyan:#0891b2;--red:#dc4961;--green:#138a61;--shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.04)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-variant-numeric:tabular-nums}.topbar{height:68px;background:var(--nav);color:#fff;display:flex;align-items:center;padding:0 28px;gap:24px;position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:12px;min-width:245px}.mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,#3b82f6,#06b6d4);display:grid;place-items:center;font-weight:700}.brand-name{font-size:16px;font-weight:600}.brand-sub{font-size:11px;color:#93a4bd}.nav{display:flex;gap:16px}.nav a{color:#aebbd0;text-decoration:none;font-size:13px}.nav a.active,.nav a:hover{color:#fff}.topbar select{margin-left:auto;background:var(--nav2);border:1px solid #344258;color:#eef4ff;border-radius:7px;padding:9px 34px 9px 12px;min-width:320px}.page{max-width:1500px;margin:auto;padding:24px 28px 40px}.headline{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:18px}.headline h1{font-size:22px;margin:0 0 4px;font-weight:600}.sub{color:var(--muted);font-size:13px}.rangebar{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:9px;box-shadow:var(--shadow)}button,input{font:inherit}button{border:1px solid var(--border);background:#fff;color:var(--muted);border-radius:6px;padding:7px 11px;cursor:pointer}button:hover{border-color:#aab5c7;color:var(--text)}button.active{background:var(--nav);border-color:var(--nav);color:#fff}.dates{display:flex;align-items:center;gap:7px;margin-left:6px;padding-left:12px;border-left:1px solid var(--border)}input[type=date]{border:1px solid var(--border);border-radius:6px;padding:6px 9px;color:var(--text);background:#fff}.metrics{display:grid;grid-template-columns:repeat(8,minmax(120px,1fr));gap:10px;margin-bottom:12px}.metric{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:14px 15px;box-shadow:var(--shadow);min-height:86px}.metric .label{font-size:12px;color:var(--muted);margin-bottom:7px}.metric .value{font-size:21px;font-weight:600;letter-spacing:-.02em}.positive{color:var(--green)!important}.negative{color:var(--red)!important}.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);margin-top:12px;overflow:hidden}.panel-head{height:50px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}.panel-title{font-weight:600}.legend{display:flex;gap:18px;color:var(--muted);font-size:12px}.legend span{display:flex;align-items:center;gap:6px}.swatch{width:18px;height:3px;border-radius:2px}.chart-wrap{height:335px;padding:8px 12px 4px;position:relative}.chart-wrap.drawdown{height:250px}.chart{width:100%;height:100%;display:block;touch-action:none}.chart text{fill:var(--muted);font-size:11px}.chart .grid{stroke:var(--grid);stroke-width:1}.chart .axis{stroke:#cad2df;stroke-width:1}.chart .line{fill:none;stroke-width:2}.chart .zero{stroke:#a8b3c4;stroke-width:1}.chart .guide{stroke:#9aa8bb;stroke-width:1;stroke-dasharray:3 3}.chart .marker{stroke:#fff;stroke-width:2}.chart .hit{fill:transparent;cursor:crosshair}.chart-tip{position:absolute;display:none;pointer-events:none;z-index:2;min-width:150px;padding:9px 11px;border:1px solid var(--border);border-radius:7px;background:rgba(255,255,255,.96);box-shadow:var(--shadow);font-size:12px;line-height:1.6}.chart-tip .date{font-weight:600;color:var(--text);margin-bottom:3px}.chart-tip .row{display:flex;justify-content:space-between;gap:14px;color:var(--muted)}.chart-tip b{font-weight:600;color:var(--text)}.lower{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);padding:8px 18px 16px}.stat{padding:12px 4px;border-bottom:1px solid var(--border)}.stat:nth-last-child(-n+3){border-bottom:0}.stat small{display:block;color:var(--muted);font-size:12px;margin-bottom:3px}.stat b{font-size:15px;font-weight:500}.empty{padding:90px 20px;text-align:center;color:var(--muted)}.notice{font-size:12px;color:var(--muted);padding:0 18px 16px}.error{color:var(--red)}
    @media(max-width:1100px){.metrics{grid-template-columns:repeat(4,1fr)}.headline{display:block}.rangebar{margin-top:14px;flex-wrap:wrap}.lower{grid-template-columns:1fr}}
    @media(max-width:680px){.topbar{padding:0 14px}.brand{min-width:0}.brand-sub{display:none}.topbar select{min-width:130px;max-width:48vw}.page{padding:16px 12px}.metrics{grid-template-columns:repeat(2,1fr)}.dates{width:100%;margin:4px 0 0;padding:8px 0 0;border-left:0;border-top:1px solid var(--border)}input[type=date]{min-width:0;width:46%}.stats{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand"><div class="mark">PQ</div><div><div class="brand-name">Prajna Quant</div><div class="brand-sub">策略绩效展示</div></div></div><nav class="nav" aria-label="主导航"><a class="active" href="/">策略绩效</a><a href="/factors">因子研究</a></nav><select id="experiments" aria-label="选择策略实验"></select></header>
  <main class="page"><div class="headline"><div><h1 id="title">策略绩效报告</h1><div class="sub" id="subtitle">加载策略实验数据…</div></div><div class="rangebar"><button data-range="1">近1年</button><button data-range="3">近3年</button><button data-range="5">近5年</button><button class="active" data-range="all">全部</button><div class="dates"><input id="start" type="date" aria-label="开始日期"><span>至</span><input id="end" type="date" aria-label="结束日期"></div></div></div><div id="app" class="empty">正在加载策略绩效…</div></main>
  <script>
    const $=s=>document.querySelector(s),fmtPct=v=>Number.isFinite(v)?(v*100).toFixed(2)+'%':'—',fmtNum=(v,n=2)=>Number.isFinite(v)?v.toFixed(n):'—',fmtMoney=v=>Number.isFinite(v)?'¥'+Math.round(v).toLocaleString('zh-CN'):'—';let report=null;
    async function boot(){const xs=await fetch('/api/experiments').then(r=>r.json()),sel=$('#experiments');if(!xs.length){$('#app').textContent='暂无实验，请先运行 quant-research run';return}sel.innerHTML=xs.map(x=>`<option value="${x.experiment_id}">${x.name} · ${x.created_at.slice(0,10)}</option>`).join('');sel.onchange=()=>load(sel.value);document.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>preset(b.dataset.range,b));$('#start').onchange=customRange;$('#end').onchange=customRange;await load(sel.value)}
    async function load(id){report=await fetch('/api/experiments/'+id).then(r=>r.json());const eq=report.backtest.equity_curve;if(!eq.length)throw Error('实验没有净值数据');$('#title').textContent=report.name;$('#subtitle').textContent=`${report.snapshot.symbols.toLocaleString()} 只 ETF · ${report.snapshot.rows.toLocaleString()} 行 · 基准：${report.backtest.benchmark_name||'未配置'}`;$('#start').min=$('#start').value=eq[0].date;$('#end').max=$('#end').value=eq.at(-1).date;$('#start').max=eq.at(-1).date;$('#end').min=eq[0].date;renderShell();render()}
    function renderShell(){$('#app').className='';$('#app').innerHTML=`<section class="metrics">${[['ret','区间收益'],['ann','年化收益'],['bench','沪深300'],['excess','超额收益'],['dd','最大回撤'],['sharpe','夏普比率'],['calmar','卡玛比率'],['vol','年化波动']].map(([id,l])=>`<div class="metric"><div class="label">${l}</div><div class="value" id="m-${id}">—</div></div>`).join('')}</section><section class="panel"><div class="panel-head"><div class="panel-title">累计净值</div><div class="legend"><span><i class="swatch" style="background:var(--blue)"></i>策略</span><span><i class="swatch" style="background:var(--cyan)"></i>沪深300</span></div></div><div class="chart-wrap"><svg id="equity-chart" class="chart" role="img" aria-label="策略与沪深300归一化净值曲线"></svg></div></section><section class="panel"><div class="panel-head"><div class="panel-title">回撤</div><div class="legend"><span><i class="swatch" style="background:var(--red)"></i>策略</span><span><i class="swatch" style="background:var(--cyan)"></i>沪深300</span></div></div><div class="chart-wrap drawdown"><svg id="drawdown-chart" class="chart" role="img" aria-label="策略与沪深300回撤曲线"></svg></div></section><div class="lower"><section class="panel"><div class="panel-head"><div class="panel-title">因子诊断</div></div><div class="stats" id="factor-stats"></div></section><section class="panel"><div class="panel-head"><div class="panel-title">交易与成本</div></div><div class="stats" id="cost-stats"></div><div class="notice">区间指标按所选起点重新计算；夏普比率采用零无风险利率和 252 个交易日年化。</div></section></div>`;const f=report.factor,m=report.backtest.metrics,c=report.config.costs;$('#factor-stats').innerHTML=stats([['Rank IC',fmtNum(f.mean_rank_ic,3)],['ICIR',fmtNum(f.rank_ic_ir)],['正 IC 比例',fmtPct(f.rank_ic_positive_rate)],['多空收益',fmtPct(f.mean_long_short_return)],['评估截面',f.evaluated_dates.toLocaleString()],['观察数',f.observation_count.toLocaleString()]]);$('#cost-stats').innerHTML=stats([['佣金',fmtMoney(m.commission)],['滑点',fmtMoney(m.slippage_cost)],['税费',fmtMoney(m.tax)],['总成本',fmtMoney(m.total_cost)],['成交笔数',m.trade_count.toLocaleString()],['费用设置',`${(c.commission_rate*10000).toFixed(1)} / ${c.buy_slippage_bps.toFixed(1)} bps`]])}
    function stats(a){return a.map(([k,v])=>`<div class="stat"><small>${k}</small><b>${v}</b></div>`).join('')}
    function preset(years,button){document.querySelectorAll('[data-range]').forEach(b=>b.classList.remove('active'));button.classList.add('active');const last=new Date(report.backtest.equity_curve.at(-1).date+'T00:00:00');let start=report.backtest.equity_curve[0].date;if(years!=='all'){last.setFullYear(last.getFullYear()-Number(years));start=last.toISOString().slice(0,10)}$('#start').value=start;$('#end').value=report.backtest.equity_curve.at(-1).date;render()}
    function customRange(){document.querySelectorAll('[data-range]').forEach(b=>b.classList.remove('active'));if($('#start').value>$('#end').value)[$('#start').value,$('#end').value]=[$('#end').value,$('#start').value];render()}
    function render(){const from=$('#start').value,to=$('#end').value,eq=report.backtest.equity_curve.filter(x=>x.date>=from&&x.date<=to),bm=(report.backtest.benchmark_curve||[]).filter(x=>x.date>=from&&x.date<=to);if(eq.length<2)return;const e0=eq[0].equity,b0=bm.length?bm[0].close:1,strategy=eq.map(x=>({date:x.date,value:x.equity/e0})),benchmark=bm.map(x=>({date:x.date,value:x.close/b0})),perf=performance(strategy),bp=performance(benchmark);setMetric('ret',perf.total);setMetric('ann',perf.annual);setMetric('bench',bp.total);setMetric('excess',perf.total-bp.total);setMetric('dd',perf.maxDrawdown);setMetric('sharpe',perf.sharpe,false);setMetric('calmar',perf.calmar,false);setMetric('vol',perf.volatility);drawChart('#equity-chart',[{label:'策略',values:strategy,color:'var(--blue)'},{label:'沪深300',values:benchmark,color:'var(--cyan)'}],v=>v.toFixed(2));drawChart('#drawdown-chart',[{label:'策略',values:perf.drawdowns,color:'var(--red)'},{label:'沪深300',values:bp.drawdowns,color:'var(--cyan)'}],v=>(v*100).toFixed(2)+'%',true)}
    function performance(values){if(values.length<2)return{total:NaN,annual:NaN,volatility:NaN,sharpe:NaN,maxDrawdown:NaN,calmar:NaN,drawdowns:[]};const total=values.at(-1).value/values[0].value-1,years=Math.max((new Date(values.at(-1).date)-new Date(values[0].date))/(365.25*864e5),1/252),annual=Math.pow(Math.max(values.at(-1).value/values[0].value,0),1/years)-1,rets=values.slice(1).map((x,i)=>x.value/values[i].value-1),mean=rets.reduce((a,b)=>a+b,0)/rets.length,sd=Math.sqrt(rets.reduce((a,b)=>a+(b-mean)**2,0)/Math.max(rets.length-1,1)),volatility=sd*Math.sqrt(252),sharpe=sd?mean/sd*Math.sqrt(252):0;let peak=-Infinity,maxDrawdown=0;const drawdowns=values.map(x=>{peak=Math.max(peak,x.value);const d=x.value/peak-1;maxDrawdown=Math.min(maxDrawdown,d);return{date:x.date,value:d}});return{total,annual,volatility,sharpe,maxDrawdown,calmar:maxDrawdown<0?annual/Math.abs(maxDrawdown):0,drawdowns}}
    function setMetric(id,value,pct=true){const el=$('#m-'+id);el.textContent=pct?fmtPct(value):fmtNum(value);el.classList.toggle('positive',value>0);el.classList.toggle('negative',value<0)}
    function drawChart(selector,series,format,includeZero=false){const svg=$(selector),W=1000,H=300,M={l:64,r:22,t:16,b:36},all=series.flatMap(s=>s.values);if(!all.length){svg.innerHTML='<text x="50%" y="50%" text-anchor="middle">该区间无数据</text>';return}const times=all.map(d=>Date.parse(d.date)),vals=all.map(d=>d.value),xmin=Math.min(...times),xmax=Math.max(...times),rawMin=Math.min(...vals),rawMax=Math.max(...vals),span=Math.max(rawMax-rawMin,.01),ymin=includeZero?Math.min(rawMin,0):rawMin-span*.08,ymax=includeZero?Math.max(rawMax,0):rawMax+span*.08,x=t=>M.l+(t-xmin)/(xmax-xmin||1)*(W-M.l-M.r),y=v=>M.t+(ymax-v)/(ymax-ymin||1)*(H-M.t-M.b);let out='';for(let i=0;i<=5;i++){const v=ymin+(ymax-ymin)*i/5,yy=y(v);out+=`<line class="grid" x1="${M.l}" x2="${W-M.r}" y1="${yy}" y2="${yy}"/><text x="${M.l-10}" y="${yy+4}" text-anchor="end">${format(v)}</text>`}for(let i=0;i<=5;i++){const t=xmin+(xmax-xmin)*i/5,xx=x(t),date=new Date(t);out+=`<line class="grid" x1="${xx}" x2="${xx}" y1="${M.t}" y2="${H-M.b}"/><text x="${xx}" y="${H-10}" text-anchor="middle">${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}</text>`}if(includeZero&&ymin<0&&ymax>0)out+=`<line class="zero" x1="${M.l}" x2="${W-M.r}" y1="${y(0)}" y2="${y(0)}"/>`;series.forEach(s=>{if(!s.values.length)return;const d=s.values.map((p,i)=>`${i?'L':'M'}${x(Date.parse(p.date)).toFixed(2)},${y(p.value).toFixed(2)}`).join('');out+=`<path class="line" stroke="${s.color}" d="${d}"/>`});out+=`<line class="guide" x1="${M.l}" x2="${M.l}" y1="${M.t}" y2="${H-M.b}" visibility="hidden"/><g class="markers"></g><rect class="hit" x="${M.l}" y="${M.t}" width="${W-M.l-M.r}" height="${H-M.t-M.b}"/><line class="axis" x1="${M.l}" x2="${W-M.r}" y1="${H-M.b}" y2="${H-M.b}"/>`;svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.innerHTML=out;const wrap=svg.parentElement,tip=wrap.querySelector('.chart-tip')||Object.assign(document.createElement('div'),{className:'chart-tip',role:'status'}),guide=svg.querySelector('.guide'),markers=svg.querySelector('.markers');if(!tip.parentElement)wrap.append(tip);const nearest=(values,t)=>values.reduce((best,p)=>Math.abs(Date.parse(p.date)-t)<Math.abs(Date.parse(best.date)-t)?p:best,values[0]);const move=e=>{const rect=svg.getBoundingClientRect(),px=Math.max(M.l,Math.min(W-M.r,(e.clientX-rect.left)/rect.width*W)),time=xmin+(px-M.l)/(W-M.l-M.r)*(xmax-xmin),points=series.filter(s=>s.values.length).map(s=>({series:s,point:nearest(s.values,time)})),date=points[0].point.date;guide.setAttribute('x1',px);guide.setAttribute('x2',px);guide.setAttribute('visibility','visible');markers.innerHTML=points.map(({series:s,point:p})=>`<circle class="marker" cx="${px}" cy="${y(p.value)}" r="4" fill="${s.color}"/>`).join('');tip.innerHTML=`<div class="date">${date}</div>${points.map(({series:s,point:p})=>`<div class="row"><span>${s.label}</span><b>${format(p.value)}</b></div>`).join('')}`;const wr=wrap.getBoundingClientRect(),left=Math.min(wr.width-168,Math.max(8,e.clientX-wr.left+14)),top=Math.min(wr.height-82,Math.max(8,e.clientY-wr.top+12));tip.style.left=left+'px';tip.style.top=top+'px';tip.style.display='block'};const hide=()=>{guide.setAttribute('visibility','hidden');markers.innerHTML='';tip.style.display='none'};svg.onpointermove=move;svg.onpointerdown=move;svg.onpointerleave=hide}
    window.addEventListener('resize',()=>report&&render());boot().catch(e=>{$('#app').className='empty error';$('#app').textContent='加载失败：'+e.message});
  </script>
</body>
</html>
