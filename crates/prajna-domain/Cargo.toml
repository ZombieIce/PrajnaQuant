[package]
name = "prajna-domain"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.1"
description = "Shared domain primitives for Prajna Quant"
license = "MIT"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
serde = { version = "1.0", features = ["derive"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
