[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "prajna"
dynamic = ["version"]
description = "Local Python entry point for the Rust-first Prajna research platform"
requires-python = ">=3.12"
license = "MIT"

[tool.maturin]
manifest-path = "crates/prajna-py/Cargo.toml"
python-source = "python"
module-name = "prajna._native"
bindings = "pyo3"
