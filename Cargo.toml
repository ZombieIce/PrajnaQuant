[package]
name = "ashare-warehouse"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.1"
description = "Versioned local A-share research warehouse"
license = "MIT"
publish = false

[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.test]
debug = "line-tables-only"
incremental = true

[workspace]
members = ["crates/prajna-domain", "crates/quant-research"]
resolver = "2"

[patch.crates-io]
polars-io = { path = "poc/vendor/polars-io" }

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
duckdb = { version = "=1.10505.0", features = ["bundled"] }
encoding_rs = "0.8"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.14"
uuid = { version = "1.11", features = ["v4", "serde"] }
zip = "6.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
