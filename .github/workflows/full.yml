name: Full

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # 02:00 Asia/Shanghai

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-workspace:
    name: rust-workspace (bundled DuckDB)
    runs-on: ubuntu-latest
    steps:
      - name: Free runner disk for the bundled DuckDB build
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: full-workspace
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  pyo3:
    name: b3-pyo3
    # Same platform as the local POC host (macOS ARM64, Python 3.12 framework build).
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
        with:
          key: pyo3
      - run: cargo test -p quant-research --no-default-features --features b3-pyo3 --locked

  nautilus:
    name: nautilus-integration
    # The pinned nautilus_trader 2.0.0rc5 wheel is verified on macOS ARM64 only.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
        with:
          key: nautilus
      - run: cargo build -p quant-research --no-default-features --locked
      - run: python -m pip install -r poc/poc0-benchmark/requirements-nautilus.txt
      - name: POC Python tests (no skips allowed)
        run: |
          set -o pipefail
          python -m unittest discover -s poc/poc0-benchmark -p 'test*.py' -v 2>&1 | tee unittest.log
          if grep -q "skipped" unittest.log; then
            echo "::error::Nautilus integration tests were skipped"
            exit 1
          fi

  nautilus-lockstep:
    name: nautilus-rc6-lockstep-spike
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r poc/mvp4-lockstep/requirements-nautilus.txt
      - name: MVP-4 real Backend spike (no skips allowed)
        run: |
          set -o pipefail
          python -m unittest discover -s poc/mvp4-lockstep -v 2>&1 | tee lockstep-unittest.log
          if grep -q "skipped" lockstep-unittest.log; then
            echo "::error::MVP-4 Nautilus integration tests were skipped"
            exit 1
          fi

  nautilus-worker:
    name: nautilus-rc6-worker
    # macOS ARM64 is verified locally; Linux x86_64 remains unverified.
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
        with:
          key: nautilus-worker
      - run: python -m pip install -r backends/nautilus/requirements.txt
      - name: Real worker tests (no skips allowed)
        run: |
          set -o pipefail
          python -m unittest discover -s backends/nautilus -v 2>&1 | tee worker-unittest.log
          if grep -q "skipped" worker-unittest.log; then
            echo "::error::Nautilus worker tests were skipped"
            exit 1
          fi
      - name: Shared fake / real Backend protocol and ledger suite
        env:
          PRAJNA_NAUTILUS_PYTHON: python
        run: cargo test -p prajna-adapter --locked
      - name: Cached / fresh real worker Run parity (no skips)
        run: |
          set -o pipefail
          python -m unittest discover -s poc/mvp4-cost -v 2>&1 | tee prepared-worker.log
          if grep -q "skipped" prepared-worker.log; then
            echo "::error::Prepared worker tests were skipped"
            exit 1
          fi
      - name: A15 independent golden / Fast / real Accurate correctness (no fake or skips)
        env:
          PRAJNA_NAUTILUS_PYTHON: python
          PRAJNA_CORRECTNESS_REPORT: accurate-correctness.json
        run: |
          set -o pipefail
          cargo test -p prajna-experiment --features nautilus-integration --test accurate_correctness --locked 2>&1 | tee accurate-correctness.log
          if grep -Eq '[1-9][0-9]* ignored|skipped' accurate-correctness.log; then
            echo "::error::Accurate correctness tests were skipped"
            exit 1
          fi
      - name: A16 per-Run research timing regression
        run: cargo test -p prajna-experiment --features nautilus-integration --example measure_accurate --locked
      - name: MVP-5 acceptance and Python-hosted S2 Accurate smoke (no skips)
        env:
          PRAJNA_PY_NAUTILUS: "1"
        run: |
          set -o pipefail
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install 'maturin==1.15.0' -r backends/nautilus/requirements.txt
          maturin develop --locked
          cargo build -p prajna-experiment --bin prajna-experiment --example prepare_fixture --example acceptance_fixture --locked
          python -m unittest discover -s python/tests -v 2>&1 | tee python-accurate.log
          if grep -q "skipped" python-accurate.log; then
            echo "::error::Python Accurate tests were skipped"
            exit 1
          fi
      - name: Preserve classified correctness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accurate-correctness
          path: |
            accurate-correctness.json
            accurate-correctness.log
          if-no-files-found: error

  pyarrow-interop:
    name: pyarrow-interop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
        with:
          key: pyarrow-interop
      - run: cargo build -p prajna-data --example fixture_v1 --locked
      - run: python -m pip install -r poc/poc0-benchmark/requirements-pyarrow.txt
      - name: PyArrow interoperability tests (no skips allowed)
        run: |
          set -o pipefail
          python -m unittest discover -s crates/prajna-data/tests/python -p 'test_pyarrow_interop.py' -v 2>&1 | tee unittest.log
          if grep -q "skipped" unittest.log; then
            echo "::error::PyArrow interoperability tests were skipped"
            exit 1
          fi

  web:
    name: web-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
