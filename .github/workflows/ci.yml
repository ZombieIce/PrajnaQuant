name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Workflow helper synthetic tests (positive count required)
        run: >-
          python scripts/workflow.py run --kind unittest --executor CI-core
          --selection tests.test_workflow --log "$RUNNER_TEMP/workflow-tests.log"
          -- python -m unittest tests.test_workflow -v

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: lightweight

      - name: Guard - lightweight path must not pull in bundled DuckDB
        run: |
          set -euo pipefail
          tree=$(cargo tree -p quant-research --no-default-features -e normal,build,dev --prefix none --locked)
          if grep -E '^(libduckdb-sys|duckdb|ashare-warehouse) ' <<<"$tree"; then
            echo "::error::DuckDB or ashare-warehouse is in the lightweight dependency graph"
            exit 1
          fi

      - name: Guard - prajna-domain and prajna-data must not pull in legacy warehouse dependencies
        run: |
          set -euo pipefail
          for package in prajna-domain prajna-data; do
            tree=$(cargo tree -p "$package" -e normal,build,dev --prefix none --locked)
            if grep -E '^(libduckdb-sys|duckdb|ashare-warehouse|polars[^ ]*) ' <<<"$tree"; then
              echo "::error::DuckDB, Polars, or ashare-warehouse is in the $package dependency graph"
              exit 1
            fi
          done
          if ! grep -q '^tencent-transport ' <<<"$(cargo tree -p prajna-data -e normal,build,dev --prefix none --locked)"; then
            echo "::error::prajna-data must consume the shared Tencent transport"
            exit 1
          fi

      - name: Guard - shared Tencent transport must stay independent of legacy and JSON identities
        run: |
          set -euo pipefail
          tree=$(cargo tree -p tencent-transport -e normal,build,dev --prefix none --locked)
          if grep -E '^(ashare-warehouse|quant-research|prajna-data|serde_json) ' <<<"$tree"; then
            echo "::error::tencent-transport pulls in a legacy crate, prajna-data, or serde_json"
            exit 1
          fi
          if ! grep -q '^tencent-transport ' <<<"$(cargo tree -p ashare-warehouse -e normal,build,dev --prefix none --locked)"; then
            echo "::error::ashare-warehouse must use the shared Tencent transport"
            exit 1
          fi
          serde_tree=$(cargo tree -p ashare-warehouse -e features -i serde_json --locked)
          if grep -q 'serde_json feature "arbitrary_precision"' <<<"$serde_tree"; then
            echo "::error::shared transport changed the legacy serde_json feature set"
            exit 1
          fi

      - name: Guard - prajna-experiment must not depend on legacy execution stacks
        run: |
          set -euo pipefail
          tree=$(cargo tree -p prajna-experiment -e normal,build,dev --prefix none --locked)
          if grep -E '^(libduckdb-sys|duckdb|ashare-warehouse|quant-research) ' <<<"$tree"; then
            echo "::error::prajna-experiment depends on a prohibited legacy package"
            exit 1
          fi

      - name: Guard - prajna-research must not depend on the legacy warehouse or quant engine
        run: |
          set -euo pipefail
          tree=$(cargo tree -p prajna-research -e normal,build,dev --prefix none --locked)
          if grep -E '^(libduckdb-sys|duckdb|ashare-warehouse|quant-research) ' <<<"$tree"; then
            echo "::error::prajna-research depends on the legacy warehouse or quant-research"
            exit 1
          fi

      - name: Guard - prajna-py must not depend on DuckDB or quant-research
        run: |
          set -euo pipefail
          tree=$(cargo tree -p prajna-py -e normal,build,dev --prefix none --locked)
          if grep -E '^(libduckdb-sys|duckdb|ashare-warehouse|quant-research) ' <<<"$tree"; then
            echo "::error::prajna-py depends on a prohibited legacy package"
            exit 1
          fi

      - run: cargo fmt --all -- --check
      - run: cargo clippy -p quant-research --no-default-features --all-targets --locked -- -D warnings
      - run: cargo test -p quant-research --no-default-features --locked
      - name: Guard - prajna-account must only use Domain and lightweight dependencies
        run: |
          set -euo pipefail
          tree=$(cargo tree -p prajna-account -e normal,build,dev --prefix none --locked)
          if grep -E '^(libduckdb-sys|duckdb|ashare-warehouse|quant-research|prajna-research|prajna-data|prajna-experiment|polars[^ ]*|nautilus[^ ]*) ' <<<"$tree"; then
            echo "::error::prajna-account depends on a prohibited execution or data package"
            exit 1
          fi

      - run: cargo clippy -p prajna-account --all-targets --locked -- -D warnings
      - run: cargo test -p prajna-account --locked
      - name: Guard - prajna-adapter must remain Rust-only and lightweight
        run: |
          set -euo pipefail
          tree=$(cargo tree -p prajna-adapter -e normal,build,dev --prefix none --locked)
          if grep -E '^(libduckdb-sys|duckdb|ashare-warehouse|quant-research|pyo3[^ ]*|nautilus[^ ]*) ' <<<"$tree"; then
            echo "::error::prajna-adapter depends on a prohibited legacy or Backend package"
            exit 1
          fi

      - run: cargo clippy -p prajna-adapter --all-targets --locked -- -D warnings
      - run: cargo test -p prajna-adapter --locked
      - run: cargo clippy -p prajna-domain --all-targets --locked -- -D warnings
      - run: cargo test -p prajna-domain --locked
      - run: cargo clippy -p prajna-data --all-targets --locked -- -D warnings
      - run: cargo test -p prajna-data --locked
      - run: cargo clippy -p prajna-research --all-targets --locked -- -D warnings
      - run: cargo test -p prajna-research --locked
      - run: cargo clippy -p prajna-experiment --all-targets --locked -- -D warnings
      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: "3.12"
      - run: cargo test -p prajna-experiment --locked -- --include-ignored
        env:
          PRAJNA_TEST_PYTHON: ${{ steps.setup-python.outputs.python-path }}
      - name: A16 per-Run research timing regression (no Nautilus required)
        run: cargo test -p prajna-experiment --features nautilus-integration --example measure_accurate --locked

      - run: cargo clippy -p prajna-py --all-targets --locked -- -D warnings
      - run: cargo test -p prajna-py --locked

      - name: Build prajna extension in a fresh Python 3.12 venv
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install 'maturin==1.15.0'
          maturin develop --locked

      - name: Prajna Python tests
        run: |
          cargo build -p prajna-experiment --bin prajna-experiment --example prepare_fixture --example acceptance_fixture --example pit_fixture --locked
          .venv/bin/python -m unittest discover -s python/tests -v

      # Feature-only code (b3-pyo3) must still type-check when shared signatures change.
      - run: cargo check -p quant-research --no-default-features --features b3-pyo3 --all-targets --locked

      # Nautilus-dependent tests skip here by design; the Full workflow runs them and fails on skips.
      - name: POC Python tests (Nautilus not installed)
        run: python -m unittest discover -s poc/poc0-benchmark -p 'test*.py' -v

      - name: Tencent fallback collector (synthetic responses only)
        run: python -m unittest tests.test_tencent_fallback_collector -v

      - name: MVP-1 Vector golden tests
        run: python -m unittest tests.test_mvp1_vector_golden -v

      - name: MVP-2 benchmark report tests
        run: python -m unittest tests.test_mvp2_benchmark -v

      - name: MVP-3 independent Fast Event golden tests
        run: python -m unittest tests.test_mvp3_fast_event_golden -v

      - name: MVP-4 synthetic fixture preparation (no Nautilus required)
        run: python -m unittest tests.test_mvp4_fixture_prepare -v

      - name: MVP-4 cost report and resource gate (no Nautilus required)
        run: python -m unittest tests.test_mvp4_cost -v

      - name: MVP-5 record-only throughput report tests
        run: python -m unittest tests.test_mvp5_benchmark -v

  paths:
    name: web-applicability
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.paths.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Determine browser validation applicability
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python scripts/workflow.py paths --base "$BASE_SHA" --head "$HEAD_SHA" > "$RUNNER_TEMP/paths.json"
          python - <<'PYTHON'
          import json, os
          with open(os.environ['RUNNER_TEMP'] + '/paths.json') as source:
              result = json.load(source)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('web=' + str(result['web_required']).lower() + '\n')
          print('Browser validation: ' + ('required' if result['web_required'] else 'not applicable by approved paths'))
          PYTHON

  web:
    name: web-production-validation
    needs: paths
    if: needs.paths.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
        with:
          key: web-app
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Verification environment preflight
        run: |
          BROWSER=$(cd apps/web && node --input-type=module -e "import { chromium } from '@playwright/test'; console.log(chromium.executablePath())")
          python scripts/workflow.py preflight --browser "$BROWSER"
      # The existing browser preparation remains offline after explicit lockfile fetch.
      - run: cargo fetch --locked
      - name: Build and E2E typecheck / discovery
        working-directory: apps/web
        run: |
          npm run build
          npm run test:e2e:check
      # These app-feature reading-side tests are excluded by core's no-default-features test.
      - name: App reading-side regression tests
        run: >-
          python scripts/workflow.py run --kind cargo --executor CI-web
          --selection comparison_api::tests --log "$RUNNER_TEMP/app-reading.log"
          -- cargo test -p quant-research --features app --lib comparison_api::tests --locked --offline
      - name: Synthetic browser through production API and persisted Rust results
        run: >-
          python scripts/workflow.py run --kind playwright --executor CI-web
          --selection all-existing-browser-specs --timeout 3300 --log "$RUNNER_TEMP/browser.log"
          -- npm --prefix apps/web run test:e2e
      # No upload-artifact: identities, raw service output, screenshots and traces stay runner-local.

  lightweight:
    name: lightweight
    needs: [core, paths, web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preserve required gate semantics
        env:
          CORE: ${{ needs.core.result }}
          PATHS: ${{ needs.paths.result }}
          WEB: ${{ needs.web.result }}
          WEB_REQUIRED: ${{ needs.paths.outputs.web }}
        run: |
          test "$PATHS" = success
          python scripts/workflow.py gate --core "$CORE" --web "$WEB" --web-required "$WEB_REQUIRED"
