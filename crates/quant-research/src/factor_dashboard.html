<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prajna Quant · 因子研究</title><style>:root{--nav:#111827;--bg:#f4f6fa;--panel:#fff;--text:#172033;--muted:#697386;--border:#e2e7ef;--grid:#e9edf3;--blue:#2563eb;--cyan:#0891b2;--red:#dc4961}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,"PingFang SC",system-ui,sans-serif}.top{height:68px;background:var(--nav);display:flex;align-items:center;padding:0 28px;gap:22px;color:#fff}.brand{font-weight:600}.nav a{color:#aebbd0;text-decoration:none;margin-right:16px}.nav a.active{color:#fff}.top select{margin-left:auto;background:#1f2937;border:1px solid #344258;color:#fff;border-radius:7px;padding:9px;min-width:280px}.page{max-width:1500px;margin:auto;padding:24px 28px 42px}h1{font-size:22px;margin:0 0 4px}.sub{color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:10px;margin:18px 0 12px}.metric,.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px}.metric{padding:14px;min-height:82px}.metric small{display:block;color:var(--muted);margin-bottom:6px}.metric b{font-size:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel{overflow:hidden}.head{padding:14px 16px;border-bottom:1px solid var(--border);font-weight:600}.chart{height:270px;padding:10px}.chart svg{width:100%;height:100%}.chart text{fill:var(--muted);font-size:11px}.chart .g{stroke:var(--grid)}.chart .l{fill:none;stroke:var(--blue);stroke-width:2}.chart .l2{fill:none;stroke:var(--cyan);stroke-width:2}.notice{padding:18px;color:var(--muted);min-height:110px}.heat{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;padding:16px}.cell{height:24px;border-radius:3px}.legend{font-size:12px;color:var(--muted);padding:0 16px 14px}@media(max-width:900px){.metrics{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:600px){.top{padding:0 14px}.top select{min-width:120px}.page{padding:16px 12px}.metrics{grid-template-columns:repeat(2,1fr)}}</style></head><body><header class="top"><div class="brand">PQ · Prajna Quant</div><nav class="nav"><a href="/">策略绩效</a><a class="active" href="/factors">因子研究</a></nav><select id="exp" aria-label="选择实验"></select></header><main class="page"><h1 id="title">因子研究报告</h1><div class="sub" id="sub">加载实验数据…</div><section class="metrics" id="metrics"></section><section class="grid" id="charts"></section></main><script>const $=s=>document.querySelector(s),pct=x=>Number.isFinite(x)?(x*100).toFixed(2)+'%':'—',num=(x,n=3)=>Number.isFinite(x)?x.toFixed(n):'—';let report;async function boot(){let xs=await fetch('/api/experiments').then(r=>r.json()),s=$('#exp');s.innerHTML=xs.map(x=>`<option value="${x.experiment_id}">${x.name} · ${x.created_at.slice(0,10)}</option>`).join('');s.onchange=()=>load(s.value);await load(s.value)}async function load(id){report=await fetch('/api/experiments/'+id).then(r=>r.json());render()}function panel(title,body){return `<section class="panel"><div class="head">${title}</div>${body}</section>`}function render(){let f=report.factor,d=f.daily||[],ics=d.map(x=>x.rank_ic),qs=f.quantiles||5;$('#title').textContent=f.factor==='etf_rotation_score'?'ETF轮动综合因子研究':'动量因子研究';$('#sub').textContent=`${report.name} · Forward ${f.forward_days} 日 · ${d.length.toLocaleString()} 个有效截面`;$('#metrics').innerHTML=[['覆盖观察数',f.observation_count.toLocaleString()],['Mean Rank IC',num(f.mean_rank_ic)],['ICIR',num(f.rank_ic_ir)],['IC 胜率',pct(f.rank_ic_positive_rate)],['IC 标准差',num(f.rank_ic_stddev)],['多空平均收益',pct(f.mean_long_short_return)]].map(x=>`<div class="metric"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('');let q=d.length?d[0].quantile_returns.map((_,i)=>d.reduce((a,x)=>a+x.quantile_returns[i],0)/d.length):[];$('#charts').innerHTML=panel('数据覆盖 / 有效股票数',line(d.map(x=>x.count),'#0891b2'))+panel('Rank IC 时间序列',line(ics,'#2563eb',true))+panel('Rolling Rank IC（60期）',line(ics.map((_,i)=>mean(ics.slice(Math.max(0,i-59),i+1))),'#2563eb',true))+panel('IC 分布',hist(ics))+panel('IC 年月热力图',heat(d))+panel('分组平均未来收益',bars(q))+panel('分组累计净值',multiNav(d.map(x=>x.quantile_returns),qs))+panel('多空累计净值',nav(d.map(x=>x.long_short_return),'#dc4961'))+panel('IC Decay',unavailable('需在配置中启用多个 forward_periods 后计算'))+panel('换手率与成本敏感性',unavailable('需接入组合持仓序列与成本情景'))+panel('风险暴露',unavailable('需接入历史市值、行业与中性化数据'))+panel('因子相关性',unavailable('单因子实验；多因子矩阵待接入'));}function mean(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0}function svg(points,color='#2563eb',zero=false){let w=600,h=230,m=36,v=points.length?points:[0],lo=Math.min(...v,zero?0:Infinity),hi=Math.max(...v,zero?0:-Infinity),sp=Math.max(hi-lo,.001),x=i=>m+i/Math.max(v.length-1,1)*(w-m-8),y=z=>10+(hi-z)/sp*(h-36);let g='';for(let i=0;i<5;i++){let yy=10+i/4*(h-46);g+=`<line class="g" x1="${m}" x2="${w-8}" y1="${yy}" y2="${yy}"/>`}let p=v.map((z,i)=>`${i?'L':'M'}${x(i)},${y(z)}`).join('');return `<div class="chart"><svg viewBox="0 0 ${w} ${h}">${g}<path class="l" stroke="${color}" d="${p}"/></svg></div>`}function line(v,c,z){return svg(v,c,z)}function nav(r,c){let x=1;return svg(r.map(v=>x*=1+v),c)}function multiNav(rows,q){let vals=Array.from({length:q},()=>[]),navs=Array(q).fill(1);rows.forEach(r=>r.forEach((v,i)=>vals[i].push(navs[i]*=(1+v))));let w=600,h=230,m=36,all=vals.flat(),lo=Math.min(...all),hi=Math.max(...all),sp=Math.max(hi-lo,.001),x=i=>m+i/Math.max(rows.length-1,1)*(w-m-8),y=z=>10+(hi-z)/sp*(h-36);let colors=['#2563eb','#0891b2','#697386','#dc4961','#138a61','#7c3aed','#f59e0b','#ec4899','#14b8a6','#6b7280'];let paths=vals.map((v,j)=>`<path class="l" stroke="${colors[j]}" d="${v.map((z,i)=>`${i?'L':'M'}${x(i)},${y(z)}`).join('')}/> `).join('');return `<div class="chart"><svg viewBox="0 0 ${w} ${h}">${paths}</svg></div>`}function hist(v){let n=12,lo=Math.min(...v),hi=Math.max(...v),sp=Math.max(hi-lo,.001),b=Array(n).fill(0);v.forEach(x=>b[Math.min(n-1,Math.floor((x-lo)/sp*n))]++);return bars(b)}function bars(v){let max=Math.max(...v,1),w=600,h=230,bw=(w-60)/v.length;return `<div class="chart"><svg viewBox="0 0 ${w} ${h}">${v.map((x,i)=>`<rect x="${42+i*bw}" y="${200-x/max*180}" width="${Math.max(3,bw-4)}" height="${x/max*180}" fill="#2563eb"/>`).join('')}</svg></div>`}function heat(d){let buckets=Array(12).fill().map(()=>[]);d.forEach(x=>buckets[new Date(x.date+'T00:00:00').getMonth()].push(x.rank_ic));return `<div class="heat">${buckets.map(a=>{let v=mean(a),alpha=Math.min(.9,.15+Math.abs(v)*8),color=v>=0?`rgba(19,138,97,${alpha})`:`rgba(220,73,97,${alpha})`;return `<div class="cell" style="background:${color}" title="${num(v)}"></div>`}).join('')}</div><div class="legend">按月汇总的平均 Rank IC；绿色为正、红色为负。</div>`}function unavailable(s){return `<div class="notice">${s}</div>`}boot().catch(e=>document.body.innerHTML='<main class="page">加载失败：'+e.message+'</main>')</script></body></html>
